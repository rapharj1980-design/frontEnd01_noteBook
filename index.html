<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    
    <title>Formulário Clientes</title>
</head>
<body>
    <div class="container">
        <h2>Cadastrar Usuário</h2>
        
        <form id="formUsuario">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite o nome completo">
            </div>

            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required placeholder="Digite o e-mail">
            </div>

            <button type="submit">Salvar no PostgreSQL</button>
        </form>

        <!-- Mensagem de retorno do servidor -->
        <div id="mensagem"></div>
    </div>

    <script src="script.js"></script>   
</body>
</html>
